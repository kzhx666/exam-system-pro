<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>教师后台</title>
<style>
    body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 1200px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
    th { background: #fafafa; }
    .status-ok { color: #52c41a; font-weight: bold; margin-right: 5px; }
    .status-err { color: #f5222d; margin-right: 5px; }
    .btn-del { padding: 5px 10px; background: #ff4d4f; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function renderAllMath() {
                if (window.renderMathInElement) {
                    renderMathInElement(document.body, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            }
            
            // 采用 MutationObserver 监听 DOM 变化
            // 确保试卷数据异步加载到页面后，也能瞬间触发公式渲染
            const observer = new MutationObserver((mutations) => {
                observer.disconnect(); // 暂停监听，防止死循环
                renderAllMath();
                observer.observe(document.body, { childList: true, subtree: true }); // 恢复监听
            });
            observer.observe(document.body, { childList: true, subtree: true });
        });
    </script>

</head>
<body>
    <div class="card">
        <h2>📊 考试成绩汇总</h2>
        <table>
            <thead><tr><th width="50">排名</th><th width="100">学生姓名</th><th width="70">总分</th><th>答题详情</th><th width="80">操作</th></tr></thead>
            <tbody id="stat-body"></tbody>
        </table>
    </div>
    <script>
        const eid = window.location.pathname.split('/').pop();
        async function load() {
            const res = await fetch('/api/submissions/' + eid); const data = await res.json();
            data.sort((a,b) => b.score - a.score);
            document.getElementById('stat-body').innerHTML = data.map((s, i) => {
                let detail = Object.entries(s.details).map(([qid, status]) => {
                    const isOk = status === "对";
                    return `<span class="${isOk?'status-ok':'status-err'}">${qid.replace('q_','')}:${status}</span>`;
                }).join(' ');
                return `<tr><td>${i+1}</td><td><b>${s.name}</b></td><td style="color:red; font-weight:bold;">${s.score}</td><td style="text-align:left;">${detail}</td>
                        <td><button class="btn-del" onclick="delSub(${s.id})">删除</button></td></tr>`;
            }).join('');
        }
        async function delSub(sid) {
            if(!confirm("确定删除该学生的答题记录吗？")) return;
            await fetch('/api/submissions/' + sid, { method: 'DELETE' });
            load();
        }
        load();
    </script>
</body>
</html>
